spring.application.name=finduhouse-backend
server.port=${PORT:8080}

finduhouse.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finduhouse}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finduhouse}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finduhouse}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
