services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finduhouse-server
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-finduhouse}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-finduhouse}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-finduhouse}
      SPRING_MAIL_HOST: servidor-email
      SPRING_MAIL_PORT: 25
    depends_on:
      database:
        condition: service_healthy
      servidor-email:
        condition: service_started

  servidor-email:
    build:
      context: ./servidor-email
      dockerfile: Dockerfile
    container_name: finduhouse-servidor-email
    ports:
      - "${MAIL_PORT:-2525}:25"

  database:
    image: postgres:16-alpine
    container_name: finduhouse-database
    environment:
      POSTGRES_DB: ${DB_NAME:-finduhouse}
      POSTGRES_USER: ${DB_USER:-finduhouse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finduhouse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finduhouse} -d ${DB_NAME:-finduhouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: