services:
  server:
    build: .
    container_name: finduhouse-server
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${DB_NAME:-finduhouse}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-finduhouse}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-finduhouse}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: finduhouse-database
    environment:
      POSTGRES_DB: ${DB_NAME:-finduhouse}
      POSTGRES_USER: ${DB_USER:-finduhouse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finduhouse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finduhouse} -d ${DB_NAME:-finduhouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
