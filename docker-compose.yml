services:
  server:
    build: .
    container_name: projeto-server
    ports:
      - "12345:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/finduhouse
      SPRING_DATASOURCE_USERNAME: finduhouse
      SPRING_DATASOURCE_PASSWORD: finduhouse
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    container_name: projeto-database
    environment:
      POSTGRES_DB: finduhouse
      POSTGRES_USER: finduhouse
      POSTGRES_PASSWORD: finduhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finduhouse -d finduhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
